name: malvoya_vendor
description: Malvoya Vendor - Premium Store Management App
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  firebase_core: ^3.15.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.0.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  shimmer: ^3.0.0
  socket_io_client: ^3.0.2
  firebase_auth: ^5.7.0
  geolocator: ^13.0.2
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.2.3
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#2E6B4F"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  min_sdk_android: 21
