# Local development: `docker compose up db` and run `npm run dev` on the host,
# or `docker compose up --build` to run the API in a container too.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malvoya
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/malvoya?schema=public"
      PORT: "4000"
      NODE_ENV: "development"
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  db-data:
