name: malvoya_courier
description: Malvoya Courier - Premium Delivery App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  firebase_core: ^2.24.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  http: ^0.13.6
  intl: ^0.20.2
  provider: ^6.0.5
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  socket_io_client: ^3.0.2
  firebase_auth: ^4.15.3
  geolocator: ^13.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
