services:
  - type: web
    name: malvoya-api
    runtime: node
    plan: starter
    # EU region keeps personal data inside the EEA (GDPR Chapter V). Live as malvoya-api-eu with the
    # malvoya-db-eu database; the older Oregon service (malvoya-api-n065) is being retired.
    region: frankfurt
    rootDir: backend
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript and the Prisma CLI
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # Browser origins only (admin panel). Mobile apps are not affected by CORS.
      - key: ALLOWED_ORIGINS
        value: "https://malvoya-admin.onrender.com,https://admin.malvoya.com"
      - key: NODE_ENV
        value: production
