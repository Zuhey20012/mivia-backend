services:
  - type: web
    name: malvoya-api-eu
    runtime: node
    plan: starter
    # EU region keeps personal data inside the EEA (GDPR Chapter V). Live as malvoya-api-eu with the
    # malvoya-db-eu database; the older Oregon service (malvoya-api-n065) is being retired.
    region: frankfurt
    rootDir: backend
    # --include=dev: NODE_ENV=production would otherwise skip TypeScript and the Prisma CLI
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    # Readiness (database reachable, not draining), so a deploy only goes live once the new version can serve
    healthCheckPath: /health/ready
    # Deploy a commit only after GitHub CI (e2e suite, migration drift check) has passed on it
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      # A mailbox we control (e.g. the team Gmail). Support requests are emailed there; without it
      # they are only in the admin panel. Mail is sent as SMTP_FROM or the SMTP_USER mailbox.
      - key: SUPPORT_EMAIL
        sync: false
      # Where security researchers report problems (/.well-known/security.txt); an address you read
      - key: SECURITY_CONTACT
        sync: false
      # 32 random bytes, base64 (openssl rand -base64 32): encrypts sellers' tax IDs (DAC7). Keep a copy elsewhere.
      - key: DATA_ENCRYPTION_KEY
        sync: false
      # Optional error reports (personal data scrubbed)
      - key: SENTRY_DSN
        sync: false
      # App links: the Play App Signing SHA-256 of the customer app, and the Apple Developer Team ID
      - key: ANDROID_APP_SHA256
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      # Optional: farthest delivery from a store in km (default 10, the catalogue reach)
      # DELIVERY_MAX_KM
      # Optional order-watchdog timers in minutes (defaults shown in the admin panel → System):
      # CHECKOUT_HOLD_MINUTES, STORE_REMINDER_MINUTES, STORE_ACCEPT_MINUTES,
      # COURIER_REOFFER_MINUTES, COURIER_DELAY_NOTICE_MINUTES, COURIER_SEARCH_MINUTES
      # Browser origins only (admin panel). Mobile apps are not affected by CORS.
      - key: ALLOWED_ORIGINS
        value: "https://malvoya-admin.onrender.com,https://admin.malvoya.com"
      - key: NODE_ENV
        value: production
