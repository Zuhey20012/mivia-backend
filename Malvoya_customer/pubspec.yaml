name: malvoya_customer
description: Malvoya - Premium Marketplace App
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^7.0.2
  flutter_native_splash: ^2.4.7
  flutter_stripe: ^10.1.1
  google_sign_in: ^6.2.1
  http: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.9.1
  provider: ^6.0.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.2.0
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  socket_io_client: ^3.0.2
  video_player: ^2.11.1
  firebase_messaging: ^15.2.10
  share_plus: ^13.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon.png"
  adaptive_icon_background: "#6D2E8C"
  adaptive_icon_foreground: "assets/brand/icon_fg.png"
  min_sdk_android: 21
